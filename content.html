<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content - Studio</title>
    <script>
      (() => {
        const storageKey = "studio-theme";
        const root = document.documentElement;
        try {
          const savedTheme = localStorage.getItem(storageKey);
          const defaultTheme = "dark";
          const theme = savedTheme === "dark" || savedTheme === "light" ? savedTheme : defaultTheme;
          root.dataset.theme = theme;
          root.style.colorScheme = theme;
        } catch (error) {
          root.dataset.theme = "dark";
          root.style.colorScheme = "dark";
        }
      })();
    </script>
    <style>
      :root {
        color-scheme: light;
        --color-bg-page: #fafbfc;
        --color-bg-header: #ffffff;
        --color-bg-surface: #ffffff;
        --color-bg-elevated: #ffffff;
        --color-bg-subtle: #f6f7f8;
        --color-bg-selected: #e8ebee;
        --color-text-primary: #0b0d0f;
        --color-text-secondary: #71717a;
        --color-text-muted: #52525b;
        --color-text-disabled: #a1a1aa;
        --color-text-inverse: #ffffff;
        --color-border-default: #edf0f2;
        --color-border-subtle: #d4d7dc;
        --color-brand-primary: #00d157;
        --color-brand-hover: #00bd4f;
        --color-brand-active: #00a846;
        --color-status-success-bg: #eef8f2;
        --color-mask: rgba(11, 13, 15, 0.72);
        --color-shadow: rgba(20, 23, 26, 0.08);
        --brand: var(--color-brand-primary);
        --brand-600: var(--color-brand-active);
        --text: var(--color-text-primary);
        --muted: var(--color-text-secondary);
        --line: var(--color-border-default);
        --surface: var(--color-bg-surface);
        --page: var(--color-bg-page);
        --nav-hover: var(--color-bg-subtle);
        --nav-active: var(--color-bg-selected);
        --focus: none;
        --radius: 6px;
        --content-toolbar-height: 136px;
        --workspace-x: 28px;
      }

      html[data-theme="dark"] {
        color-scheme: dark;
        --color-bg-page: #111417;
        --color-bg-header: #171b1f;
        --color-bg-surface: #1c2228;
        --color-bg-elevated: #20272e;
        --color-bg-subtle: #252d35;
        --color-bg-selected: #2a353f;
        --color-text-primary: #f4f7f8;
        --color-text-secondary: #aab4bf;
        --color-text-muted: #c7d0d8;
        --color-text-disabled: #68737f;
        --color-text-inverse: #08110d;
        --color-border-default: #2d3741;
        --color-border-subtle: #3a4652;
        --color-brand-primary: #00d157;
        --color-brand-hover: #12e06b;
        --color-brand-active: #73f2a0;
        --color-status-success-bg: rgba(0, 209, 87, 0.14);
        --color-mask: rgba(0, 0, 0, 0.66);
        --color-shadow: rgba(0, 0, 0, 0.34);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        overflow: hidden;
        background: var(--page);
        color: var(--text);
        font-family: "Inter var", "Inter", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      }

      html.is-resizing *,
      html.is-resizing *::before,
      html.is-resizing *::after {
        transition: none !important;
      }

      button,
      a {
        font: inherit;
      }

      .topbar {
        position: fixed;
        inset: 0 0 auto 0;
        z-index: 100;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 0 24px;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }

      .brand-logo-link {
        display: inline-flex;
        align-items: center;
        border-radius: 4px;
      }

      .brand-logo-link:focus-visible {
        outline: none;
      }

      .brand-logo {
        display: block;
        width: auto;
        height: 20px;
        object-fit: contain;
        object-position: left center;
      }

      .brand-title {
        transform: translateY(2.5px);
        font-size: 20px;
        line-height: 28px;
        font-weight: 500;
        letter-spacing: 0;
        white-space: nowrap;
      }

      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .language-switch,
      .theme-switch {
        position: relative;
        display: inline-flex;
      }

      .icon-button {
        width: 36px;
        height: 36px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        border: 0;
        border-radius: var(--radius);
        background: transparent;
        color: #60646c;
        cursor: pointer;
      }

      .icon-button:hover {
        background: #f6f7f8;
        color: var(--text);
      }

      .theme-icon {
        width: 20px;
        height: 20px;
      }

      html[data-theme="light"] .theme-icon-sun,
      html[data-theme="dark"] .theme-icon-moon {
        display: none;
      }

      .language-trigger:focus-visible,
      .language-switch.is-open .language-trigger {
        border-color: var(--brand);
      }

      .language-tooltip,
      .theme-tooltip {
        position: absolute;
        top: calc(100% + 8px);
        left: 50%;
        z-index: 30;
        padding: 5px 8px;
        border-radius: 4px;
        background: rgba(11, 13, 15, 0.72);
        color: #ffffff;
        font-size: 12px;
        line-height: 16px;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, -2px);
        transition: opacity 120ms ease 250ms, transform 120ms ease 250ms;
      }

      .language-switch:hover .language-tooltip,
      .theme-switch:hover .theme-tooltip {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      .language-switch.is-open .language-tooltip,
      .language-switch.suppress-tooltip .language-tooltip,
      .language-switch.tooltip-muted .language-tooltip,
      .theme-switch.tooltip-muted .theme-tooltip,
      .theme-switch.suppress-tooltip .theme-tooltip {
        opacity: 0;
        transform: translate(-50%, -2px);
        transition-delay: 0ms;
      }

      .account-entry {
        position: relative;
        display: inline-flex;
      }

      .account-tooltip {
        position: absolute;
        top: calc(100% + 8px);
        left: 50%;
        z-index: 30;
        padding: 5px 8px;
        border-radius: 4px;
        background: rgba(11, 13, 15, 0.72);
        color: #ffffff;
        font-size: 12px;
        line-height: 16px;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, -2px);
        transition: opacity 120ms ease 250ms, transform 120ms ease 250ms;
      }

      .account-entry:hover .account-tooltip {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      .account-entry.is-open .account-tooltip,
      .account-entry.tooltip-muted .account-tooltip,
      .account-entry.suppress-tooltip .account-tooltip {
        opacity: 0;
        transform: translate(-50%, -2px);
        transition-delay: 0ms;
      }

      .account-menu {
        position: absolute;
        top: calc(100% + 8px);
        right: 0;
        z-index: 40;
        min-width: 224px;
        padding: 6px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: 0 8px 20px rgba(20, 23, 26, 0.08);
      }

      .account-menu[hidden] {
        display: none;
      }

      .account-profile {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 10px 10px;
        border-radius: 4px;
      }

      .account-profile-avatar-wrap {
        position: relative;
        width: 40px;
        height: 40px;
        flex: 0 0 auto;
        border-radius: 999px;
        overflow: hidden;
      }

      .account-profile-avatar {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: inherit;
      }

      .account-profile-avatar-overlay {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(11, 13, 15, 0.64);
        color: #ffffff;
        opacity: 0;
        transition: opacity 120ms ease;
      }

      .account-profile-avatar-overlay .icon {
        width: 18px;
        height: 18px;
        stroke-width: 2;
      }

      .account-profile:hover {
        background: #f6f7f8;
      }

      .account-profile:focus-within {
        background: var(--surface);
      }

      .account-profile:hover .account-profile-avatar-overlay,
      .account-profile:focus-within .account-profile-avatar-overlay {
        opacity: 1;
      }

      .account-profile-copy {
        min-width: 0;
      }

      .account-profile-name {
        margin: 0;
        color: var(--text);
        font-size: 14px;
        line-height: 20px;
        font-weight: 500;
      }

      .account-profile-id {
        margin: 0;
        color: var(--text);
        font-size: 12px;
        line-height: 16px;
        font-weight: 500;
      }

      .account-menu-divider {
        height: 1px;
        margin: 6px 0;
        background: var(--line);
      }

      .account-option {
        width: 100%;
        height: 48px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 10px;
        border: 1px solid transparent;
        border-radius: 4px;
        background: transparent;
        color: var(--text);
        cursor: pointer;
        font-size: 14px;
        line-height: 20px;
        font-weight: 500;
        text-align: left;
      }

      .account-option .icon {
        width: 18px;
        height: 18px;
        stroke-width: 2;
      }

      .account-option:hover {
        background: #f6f7f8;
        color: var(--text);
      }

      .account-option.sign-out {
        color: var(--text);
      }

      .language-menu {
        position: absolute;
        top: calc(100% + 8px);
        right: 0;
        z-index: 40;
        min-width: 132px;
        padding: 6px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: 0 8px 20px rgba(20, 23, 26, 0.08);
      }

      .language-menu[hidden] {
        display: none;
      }

      .language-option {
        width: 100%;
        min-height: 34px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 0 10px;
        border: 0;
        border-radius: 4px;
        background: transparent;
        color: #3f3f46;
        cursor: pointer;
        font-size: 14px;
        line-height: 20px;
        font-weight: 500;
        text-align: left;
      }

      .language-option:hover {
        background: #f6f7f8;
        color: var(--text);
      }

      .language-option[aria-selected="true"] {
        background: #eef8f2;
        color: var(--brand-600);
        font-weight: 500;
      }

      .language-option[aria-selected="true"]:hover {
        background: #e4f6eb;
        color: var(--brand-600);
      }

      .avatar-button {
        width: 32px;
        height: 32px;
        padding: 0;
        border: 1px solid #edf0f2;
        border-radius: 999px;
        background: var(--surface);
        cursor: pointer;
      }

      .avatar-button:focus-visible,
      .icon-button:focus-visible,
      .upload-button:focus-visible,
      .nav-link:focus-visible {
        outline: none;
      }

      .avatar-button:focus-visible,
      .icon-button:focus-visible,
      .upload-button:focus-visible {
        border-color: var(--brand);
      }

      .avatar {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: 999px;
      }

      .sidebar {
        position: fixed;
        top: 64px;
        bottom: 0;
        left: 0;
        z-index: 90;
        width: 240px;
        display: flex;
        flex-direction: column;
        gap: 0;
        padding: 20px 16px;
        background: var(--surface);
        border-right: 1px solid var(--line);
      }

      .upload-button {
        width: 100%;
        min-height: 42px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        border: 0;
        border-radius: var(--radius);
        background: var(--brand);
        color: #ffffff;
        font-size: 15px;
        line-height: 20px;
        font-weight: 500;
        cursor: pointer;
        margin-bottom: 24px;
        transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
      }

      .upload-button:hover {
        background: #00bd4f;
        box-shadow: 0 10px 22px rgba(0, 209, 87, 0.24);
      }

      .upload-button:active {
        transform: translateY(1px);
      }

      .nav-list {
        display: grid;
        row-gap: 0;
        column-gap: 0;
        margin: 0;
        padding: 0;
        list-style: none;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

      .nav-list::-webkit-scrollbar {
        display: none;
      }

      .nav-link {
        min-height: 42px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 12px;
        border-radius: var(--radius);
        color: rgb(113, 113, 122);
        text-decoration: none;
        font-size: 14px;
        line-height: 20px;
        font-weight: 500;
        transition: background 120ms ease, color 120ms ease, transform 120ms ease;
      }

      .nav-link:hover {
        background: var(--nav-hover);
        color: var(--text);
      }

      .nav-link:active {
        background: var(--nav-active);
        color: #14171a;
        transform: translateY(1px);
      }

      .nav-link[aria-current="page"] {
        background: var(--nav-active);
        color: #14171a;
        font-weight: 500;
      }

      .icon {
        width: 20px;
        height: 20px;
        flex: 0 0 auto;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }

      .shell {
        height: 100%;
        padding: 64px 0 0 240px;
      }

      .workspace {
        height: 100%;
        overflow: auto;
        padding: 20px var(--workspace-x) 28px;
        scrollbar-gutter: stable;
      }

      .workspace-inner {
        min-height: 460px;
        display: grid;
        align-content: start;
        row-gap: 0;
        column-gap: 0;
        padding: 0;
      }

      .content-toolbar-frame {
        position: sticky;
        top: 0;
        z-index: 30;
        display: grid;
        row-gap: 20px;
        column-gap: 20px;
        margin: 0 calc(var(--workspace-x) * -1);
        padding: 16px var(--workspace-x);
        background: var(--page);
      }

      .content-toolbar-frame::before {
        content: "";
        position: absolute;
        right: 0;
        bottom: 100%;
        left: 0;
        height: 20px;
        background: var(--page);
        pointer-events: none;
      }

      .content-menu {
        position: relative;
        height: 48px;
        display: flex;
        align-items: center;
        gap: 28px;
        min-width: 0;
        margin: 0;
        padding: 0;
        list-style: none;
        overflow-x: auto;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

      .content-menu::after {
        content: "";
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        height: 1px;
        background: var(--line);
      }

      .content-menu-link {
        position: relative;
        height: 48px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        border: 0;
        background: transparent;
        color: #71717a;
        cursor: pointer;
        text-decoration: none;
        font-size: 16px;
        line-height: 24px;
        font-weight: 500;
        white-space: nowrap;
      }

      .content-menu-link:hover {
        color: var(--text);
      }

      .content-menu-link[aria-selected="true"] {
        color: #14171a;
        font-weight: 500;
      }

      .content-menu-link[aria-selected="true"]::after {
        content: "";
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 1;
        height: 2px;
        border-radius: 999px;
        background: var(--brand);
      }

      .content-menu-link:focus-visible {
        outline: none;
      }

      .content-view {
        min-width: 0;
        display: grid;
        gap: 16px;
        margin-top: 0;
        padding-bottom: 120px;
      }

      .content-panel[hidden] {
        display: none;
      }

      .content-filters {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
      }

      .filter-group {
        position: relative;
        display: inline-flex;
      }

      .filter-control,
      .search-control {
        min-height: 36px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        color: #3f3f46;
        font-size: 14px;
        line-height: 20px;
        font-weight: 500;
      }

      .filter-control {
        gap: 6px;
        padding: 0 10px;
        cursor: pointer;
      }

      .filter-control .icon {
        width: 16px;
        height: 16px;
        color: var(--muted);
      }

      .filter-control:hover {
        background: #f6f7f8;
      }

      .filter-control:focus-visible,
      .search-control:focus-within,
      .row-action:focus-visible {
        outline: none;
      }

      .filter-control:focus-visible,
      .filter-control[aria-expanded="true"],
      .search-control:focus-within,
      .row-action:focus-visible {
        border-color: var(--brand);
      }

      .filter-label {
        color: var(--muted);
        font-weight: 500;
      }

      .filter-value {
        color: var(--text);
        font-weight: 500;
      }

      .filter-control[data-filter-field="publicationStatus"] .filter-value {
        min-width: 64px;
        display: inline-flex;
        justify-content: center;
      }

      .filter-control[data-filter-field="publicationStatus"] .filter-value .status-pill {
        width: 100%;
      }

      .filter-control[data-filter-field="publicationStatus"] .filter-value .status-pill .icon {
        color: inherit;
      }

      .filter-menu {
        position: absolute;
        top: calc(100% + 6px);
        left: 0;
        z-index: 50;
        min-width: 156px;
        padding: 6px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: 0 8px 20px rgba(20, 23, 26, 0.08);
      }

      .filter-menu[hidden] {
        display: none;
      }

      .filter-option {
        width: 100%;
        min-height: 34px;
        display: flex;
        align-items: center;
        padding: 0 10px;
        border: 0;
        border-radius: 4px;
        background: transparent;
        color: rgb(113, 113, 122);
        cursor: pointer;
        font-size: 14px;
        line-height: 20px;
        font-weight: 500;
        text-align: left;
      }

      .filter-option:hover {
        background: #f6f7f8;
        color: var(--text);
      }

      .filter-option[aria-selected="true"] {
        color: #14171a;
      }

      .search-control {
        flex: 0 0 300px;
        margin-left: auto;
        width: 300px;
        max-width: 100%;
        padding: 0 10px;
      }

      .search-control:hover {
        background: #f6f7f8;
      }

      .search-control:focus-within {
        background: var(--surface);
      }

      .search-control .icon {
        width: 16px;
        height: 16px;
        color: var(--muted);
      }

      .search-input {
        width: 100%;
        min-width: 0;
        border: 0;
        outline: none;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-weight: 500;
      }

      .search-input::placeholder {
        color: #a1a1aa;
        font-weight: 500;
      }

      .search-input::-webkit-search-cancel-button {
        display: none;
      }

      .search-clear {
        width: 24px;
        height: 24px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 auto;
        padding: 0;
        border: 0;
        border-radius: 4px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
      }

      .search-clear:hover {
        background: #f6f7f8;
        color: var(--text);
      }

      .search-clear:focus-visible {
        outline: none;
        color: var(--text);
      }

      .search-clear[hidden] {
        display: none;
      }

      .search-clear .icon {
        width: 16px;
        height: 16px;
        stroke-width: 2;
      }

      .video-list-card {
        min-width: 0;
        overflow: visible;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: 0 1px 2px rgba(20, 23, 26, 0.04);
      }

      .video-list-header-scroll {
        position: sticky;
        top: var(--content-toolbar-height);
        z-index: 29;
        box-sizing: border-box;
        width: calc(100% + 2px);
        margin: -1px -1px 0;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: var(--radius) var(--radius) 0 0;
        background: var(--surface);
        box-shadow: 0 -24px 0 0 var(--page);
      }

      .video-list-scroll {
        overflow-x: auto;
        overflow-y: hidden;
        scrollbar-width: thin;
      }

      .video-list-table,
      .video-list-header {
        min-width: 1020px;
      }

      .video-list-header,
      .video-row {
        display: grid;
        grid-template-columns: minmax(312px, 1.5fr) 144px 168px 136px 150px;
        column-gap: 20px;
        align-items: center;
      }

      .video-list-header {
        min-height: 42px;
        padding: 0 16px;
        background: var(--surface);
        color: var(--muted);
        font-size: 12px;
        line-height: 16px;
        font-weight: 500;
      }

      .video-list-header > :nth-child(n + 2) {
        justify-self: center;
        text-align: center;
      }

      .video-row > :nth-child(n + 2) {
        justify-self: stretch;
        width: 100%;
        text-align: center;
      }

      .video-row {
        min-height: 104px;
        padding: 16px;
        border-top: 1px solid var(--line);
      }

      .video-row:hover {

        {

        {

          format: "4K",
          freePaidStatus: "Paid",

          visibilityStatus: "Private",
          updated: "Aug 9, 2026"
        },
        {
          type: "movie",
          title: "Action Set Piece",
          id: "VID-2408-0133",
          duration: "01:46:38",
          format: "",
          freePaidStatus: "Free",
          publicationStatus: "Offline",
          visibilityStatus: "Public",
          updated: "Aug 4, 2026"
        },
        {
          type: "movie",
          title: "Director Commentary",
          id: "VID-2408-0119",
          duration: "02:14:05",
          format: "4K",
          freePaidStatus: "Paid",
          publicationStatus: "Draft",
          visibilityStatus: "Private",
          updated: "Aug 1, 2026"
        }
      ];

      function t(key, ...args) {
        const message = messages[currentLanguage][key] ?? messages.en[key] ?? key;
        return typeof message === "function" ? message(...args) : message;
      }

      function setTheme(theme, persist = true) {
        const nextTheme = theme === "dark" ? "dark" : "light";
        document.documentElement.dataset.theme = nextTheme;
        document.documentElement.style.colorScheme = nextTheme;
        if (themeToggle) {
          const label = nextTheme === "dark" ? t("switchToLightMode") : t("switchToDarkMode");
          themeToggle.setAttribute("aria-label", label);
          if (themeTooltip) {
            themeTooltip.textContent = label;
          }
        }
        if (persist) {
          try {
            localStorage.setItem("studio-theme", nextTheme);
          } catch (error) {}
        }
      }

      function syncThemePreference() {
        const currentTheme = document.documentElement.dataset.theme === "dark" ? "dark" : "light";
        setTheme(currentTheme, false);
      }

      themeToggle?.addEventListener("click", () => {
        themeSwitch?.classList.add("suppress-tooltip");
        if (themeSwitch) setActiveTooltipContainer(themeSwitch);
        const nextTheme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
        setTheme(nextTheme);
        themeToggle.blur();
      });

      function getTypeLabel(type) {
        const typeKeys = {
          short: "short",
          "comic-drama": "comicDrama",
          movie: "movie",
          drama: "drama",
          anime: "anime"
        };
        return t(typeKeys[type] || type);
      }

      function getStatusKey(value) {
        const statusKeys = {
          Free: "free",
          Paid: "paid",
          Online: "online",
          Offline: "offline",
          Draft: "draft",
          Public: "public",
          Private: "private",
          免费: "free",
          付费: "paid",
          上线: "online",
          已上线: "online",
          在线: "online",
          已下线: "offline",
          下线: "offline",
          草稿: "draft",
          公开: "public",
          私密: "private"
        };
        return statusKeys[value] || value;
      }

      function getStatusLabel(value) {
        return t(getStatusKey(value));
      }

      function getPublicationClass(value) {
        const statusKey = getStatusKey(value);
        return statusKey === "online" ? "publish" : statusKey === "offline" ? "offline" : "draft";
      }

      function getPublicationIcon(value) {
        const statusKey = getStatusKey(value);
        if (statusKey === "online") {
          return `
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="4" fill="currentColor" stroke="none" />
            </svg>
          `;
        }
        if (statusKey === "offline") {
          return `
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 12h10" />
            </svg>
          `;
        }
        return `
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z" />
            <path d="M14 3v6h6" />
            <path d="M8 15h4" />
          </svg>
        `;
      }

      function renderPublicationStatus(value) {
        return `<span class="status-pill ${getPublicationClass(value)}">${getPublicationIcon(value)}<span>${getStatusLabel(value)}</span></span>`;
      }

      function getThumbBadgeLabel(item) {
        return item.type === "movie" ? item.duration : `${item.episodes} Episodes`;
      }

      function getUpdatedLabel(updated) {
        if (updated.startsWith("Today")) {
          return updated.replace("Today", t("today"));
        }
        if (updated.startsWith("Yesterday")) {
          return updated.replace("Yesterday", t("yesterday"));
        }
        const timestamp = Date.parse(updated);
        if (Number.isNaN(timestamp)) {
          return updated;
        }
        return new Intl.DateTimeFormat(currentLanguage === "zh" ? "zh-CN" : "en-US", {
          year: "numeric",
          month: currentLanguage === "zh" ? "numeric" : "short",
          day: "numeric"
        }).format(timestamp);
      }

      function syncFilterLabels() {
        filterTriggers.forEach((filterTrigger) => {
          const field = filterTrigger.dataset.filterField;
          const selectedValue = activeFilters[field];
          const valueNode = filterTrigger.querySelector("[data-filter-value]");
          if (field === "publicationStatus" && selectedValue) {
            valueNode.innerHTML = renderPublicationStatus(selectedValue);
          } else {
            valueNode.textContent = selectedValue ? getStatusLabel(selectedValue) : t("all");
          }
        });
      }

      function syncFilterOptionLabels() {
        filterOptions.forEach((option) => {
          const value = option.dataset.filterValue;
          if (option.dataset.filterField === "publicationStatus" && value) {
            option.innerHTML = renderPublicationStatus(value);
          } else if (value) {
            option.textContent = getStatusLabel(value);
          } else {
            option.textContent = t("all");
          }
        });
      }

      function syncPageSizeLabels() {
        pageSizeLabel.textContent = t("rowsPerPageLabel", pageSize);
        pageSizeOptions.forEach((option) => {
          option.textContent = t("rowsPerPageLabel", Number(option.dataset.pageSizeOption));
        });
      }

      function setLanguage(lang) {
        const nextLang = messages[lang] ? lang : "en";
        currentLanguage = nextLang;
        document.documentElement.lang = nextLang === "zh" ? "zh-CN" : "en";
        document.title = t("pageTitle");
        document.querySelectorAll("[data-i18n]").forEach((node) => {
          const key = node.dataset.i18n;
          node.textContent = t(key);
        });
        document.querySelectorAll("[data-i18n-aria-label]").forEach((node) => {
          node.setAttribute("aria-label", t(node.dataset.i18nAriaLabel));
        });
        document.querySelectorAll("[data-i18n-placeholder]").forEach((node) => {
          node.setAttribute("placeholder", t(node.dataset.i18nPlaceholder));
        });
        options.forEach((option) => {
          option.setAttribute("aria-selected", String(option.dataset.lang === nextLang));
        });
        syncFilterLabels();
        syncFilterOptionLabels();
        syncPageSizeLabels();
        renderVideoList(currentContentView);
        syncThemePreference();
        window.dispatchEvent(new CustomEvent("studio:languagechange", { detail: { language: nextLang } }));
        localStorage.setItem("studio-language", nextLang);
      }

      function suppressTooltipIfHidden(container, tooltipSelector) {
        const tooltip = container.querySelector(tooltipSelector);
        const tooltipOpacity = tooltip ? parseFloat(getComputedStyle(tooltip).opacity) : 0;
        if (tooltipOpacity < 0.95) {
          container.classList.add("suppress-tooltip");
        }
      }

      const tooltipContainers = [languageSwitch, themeSwitch, accountEntry].filter(Boolean);

      function setActiveTooltipContainer(activeContainer) {
        tooltipContainers.forEach((container) => {
          container.classList.toggle("tooltip-muted", container !== activeContainer);
        });
      }

      function clearTooltipContainerMutes() {
        tooltipContainers.forEach((container) => {
          container.classList.remove("tooltip-muted");
        });
      }

      tooltipContainers.forEach((container) => {
        container.addEventListener("pointerenter", () => {
          setActiveTooltipContainer(container);
        });
        container.addEventListener("focusin", () => {
          setActiveTooltipContainer(container);
        });
        container.addEventListener("pointerleave", () => {
          container.classList.remove("suppress-tooltip");
          if (!tooltipContainers.some((item) => item.matches(":hover"))) {
            clearTooltipContainerMutes();
          }
        });
        container.addEventListener("focusout", (event) => {
          if (!container.contains(event.relatedTarget)) {
            container.classList.remove("suppress-tooltip");
            if (!tooltipContainers.some((item) => item.contains(event.relatedTarget))) {
              clearTooltipContainerMutes();
            }
          }
        });
      });

      function closeFilterMenus() {
        filterTriggers.forEach((filterTrigger) => {
          filterTrigger.setAttribute("aria-expanded", "false");
          filterTrigger.closest(".filter-group").querySelector(".filter-menu").hidden = true;
        });
      }

      function closePageSizeMenu() {
        pageSizeSelect.classList.remove("open");
        pageSizeTrigger.setAttribute("aria-expanded", "false");
        pageSizeMenu.hidden = true;
      }

      function syncSearchClear() {
        searchClear.hidden = !searchInput.value;
      }

      searchInput.addEventListener("input", syncSearchClear);

      searchClear.addEventListener("click", (event) => {
        event.preventDefault();
        searchInput.value = "";
        syncSearchClear();
        searchInput.focus();
      });

      filterTriggers.forEach((filterTrigger) => {
        filterTrigger.addEventListener("click", (event) => {
          event.stopPropagation();
          const group = filterTrigger.closest(".filter-group");
          const filterMenu = group.querySelector(".filter-menu");
          const shouldOpen = filterMenu.hidden;
          closeFilterMenus();
          filterMenu.hidden = !shouldOpen;
          filterTrigger.setAttribute("aria-expanded", String(shouldOpen));
          closePageSizeMenu();
          menu.hidden = true;
          languageSwitch.classList.remove("is-open");
          trigger.setAttribute("aria-expanded", "false");
          accountMenu.hidden = true;
          accountEntry.classList.remove("is-open");
          accountTrigger.setAttribute("aria-expanded", "false");
        });
      });

      filterOptions.forEach((filterOption) => {
        filterOption.addEventListener("click", (event) => {
          event.stopPropagation();
          const field = filterOption.dataset.filterField;
          activeFilters[field] = filterOption.dataset.filterValue;
          filterOptions
            .filter((option) => option.dataset.filterField === field)
            .forEach((option) => {
              option.setAttribute("aria-selected", String(option === filterOption));
            });
          const group = filterOption.closest(".filter-group");
          syncFilterLabels();
          closeFilterMenus();
          currentPage = 1;
          renderVideoList(currentContentView);
          syncStickyDivider();
        });
      });

      trigger.addEventListener("click", (event) => {
        event.stopPropagation();
        const isOpen = !menu.hidden;
        languageSwitch.classList.add("suppress-tooltip");
        setActiveTooltipContainer(languageSwitch);
        if (!isOpen) {
          suppressTooltipIfHidden(languageSwitch, ".language-tooltip");
        }
        menu.hidden = isOpen;
        languageSwitch.classList.toggle("is-open", !isOpen);
        trigger.setAttribute("aria-expanded", String(!isOpen));
        accountMenu.hidden = true;
        accountEntry.classList.remove("is-open");
        accountTrigger.setAttribute("aria-expanded", "false");
        closeFilterMenus();
      });

      options.forEach((option) => {
        option.addEventListener("click", () => {
          languageSwitch.classList.add("suppress-tooltip");
          setLanguage(option.dataset.lang);
          menu.hidden = true;
          languageSwitch.classList.remove("is-open");
          trigger.setAttribute("aria-expanded", "false");
          trigger.blur();
          option.blur();
        });
      });

      document.addEventListener("click", (event) => {
        if (!event.target.closest(".language-switch")) {
          menu.hidden = true;
          languageSwitch.classList.remove("is-open");
          trigger.setAttribute("aria-expanded", "false");
        }
        if (!event.target.closest(".account-entry")) {
          accountMenu.hidden = true;
          accountEntry.classList.remove("is-open");
          accountTrigger.setAttribute("aria-expanded", "false");
        }
        if (!event.target.closest(".content-filters")) {
          closeFilterMenus();
        }
      });

      accountTrigger.addEventListener("click", (event) => {
        event.stopPropagation();
        const isOpen = !accountMenu.hidden;
        accountEntry.classList.add("suppress-tooltip");
        setActiveTooltipContainer(accountEntry);
        if (!isOpen) {
          suppressTooltipIfHidden(accountEntry, ".account-tooltip");
        }
        accountMenu.hidden = isOpen;
        accountEntry.classList.toggle("is-open", !isOpen);
        accountTrigger.setAttribute("aria-expanded", String(!isOpen));
        menu.hidden = true;
        languageSwitch.classList.remove("is-open");
        trigger.setAttribute("aria-expanded", "false");
        closeFilterMenus();
      });

      function getUpdatedTimeValue(updated) {
        if (updated.startsWith("Today")) {
          return Date.parse(`2026-08-14T${updated.split(" ")[1] || "00:00"}:00`);
        }
        if (updated.startsWith("Yesterday")) {
          return Date.parse(`2026-08-13T${updated.split(" ")[1] || "00:00"}:00`);
        }
        return Date.parse(updated);
      }

      function getVideoRows(view) {
        return (
          view === "all"
            ? [...videoItems].sort((a, b) => getUpdatedTimeValue(b.updated) - getUpdatedTimeValue(a.updated))
            : videoItems.filter((item) => item.type === view)
        ).filter((item) =>
          Object.entries(activeFilters).every(([field, value]) => {
            if (!value) return true;
            if (["freePaidStatus", "publicationStatus", "visibilityStatus"].includes(field)) {
              return getStatusKey(item[field]) === getStatusKey(value);
            }
            return item[field] === value;
          })
        );
      }

      function updatePagination(totalRows) {
        const totalPages = Math.max(1, Math.ceil(totalRows / pageSize));
        currentPage = Math.min(currentPage, totalPages);
        paginationRange.textContent = t("rowsTotal", totalRows);
        if (!totalRows) {
          pageNumbers.innerHTML = "";
          prevPageButton.disabled = true;
          nextPageButton.disabled = true;
          return;
        }
        pageNumbers.innerHTML = Array.from({ length: totalPages }, (_, index) => {
          const page = index + 1;
          return `<button class="pagination-button${page === currentPage ? " current" : ""}" type="button" aria-label="${t("pageLabel", page)}" data-page-number="${page}">${page}</button>`;
        }).join("");
        prevPageButton.disabled = currentPage <= 1;
        nextPageButton.disabled = currentPage >= totalPages;
      }

      function renderVideoList(view) {
        const rows = getVideoRows(view);
        updatePagination(rows.length);
        const visibleRows = rows.slice((currentPage - 1) * pageSize, currentPage * pageSize);
        if (!visibleRows.length) {
          contentList.innerHTML = `<div class="video-empty-state">${t("noContentYet")}</div>`;
          return;
        }
        contentList.innerHTML = visibleRows
          .map((item) => {
            const isDraft = getStatusKey(item.publicationStatus) === "draft";
            return `
              <article class="video-row">
                <div class="video-main">
                  <div class="video-thumb ${item.type}${isDraft ? " draft" : ""}">
                    <span class="video-duration">${getThumbBadgeLabel(item)}</span>
                  </div>
                  <div class="video-copy">
                    <p class="video-title">${item.title}</p>
                    <p class="video-subtitle">${item.id}</p>
                    <div class="video-tags">
                      <span class="type-tag ${item.type}">${getTypeLabel(item.type)}</span>
                    </div>
                  </div>
                </div>
                <span class="status-text">${isDraft ? "-" : getStatusLabel(item.freePaidStatus)}</span>
                ${renderPublicationStatus(item.publicationStatus)}
                <div>
                  <p class="updated-time">${getUpdatedLabel(item.updated)}</p>
                </div>
                <div class="row-actions">
                  <a class="row-action" href="edit.html?contentId=${encodeURIComponent(item.id)}&type=${encodeURIComponent(item.type)}">${t("edit")}</a>
                  <button class="row-action icon-only" type="button" aria-label="${t("delete")}">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                      <path d="M3 6h18" />
                      <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                      <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
                      <path d="M10 11v6" />
                      <path d="M14 11v6" />
                    </svg>
                  </button>
                </div>
              </article>
            `;
          })
          .join("");
      }

      function setContentView(nextView) {
        currentContentView = nextView;
        currentPage = 1;
        const selectedTab = contentTabs.find((tab) => tab.dataset.contentTab === nextView) || contentTabs[0];
        contentTabs.forEach((tab) => {
          const isSelected = tab.dataset.contentTab === nextView;
          tab.setAttribute("aria-selected", String(isSelected));
          tab.tabIndex = isSelected ? 0 : -1;
        });
        contentPanel.setAttribute("aria-labelledby", selectedTab.id);
        renderVideoList(nextView);
        syncStickyDivider();
      }

      function isElementRendered(node) {
        return Boolean(node && (node.offsetWidth || node.offsetHeight || node.getClientRects().length));
      }

      let stickyDividerFrame = 0;
      let stickyDividerScrolled = false;
      let stickyDividerScrollLeft = -1;
      let resizeSettledTimer = 0;

      function syncStickyDivider() {
        if (!isElementRendered(videoListScroll)) return;
        const nextScrollLeft = videoListScroll.scrollLeft;
        const nextScrolled = nextScrollLeft > 0;
        if (nextScrolled !== stickyDividerScrolled) {
          stickyDividerScrolled = nextScrolled;
          videoListCard.classList.toggle("is-scrolled-x", nextScrolled);
        }
        if (nextScrollLeft !== stickyDividerScrollLeft) {
          stickyDividerScrollLeft = nextScrollLeft;
          videoListHeaderScroll.scrollLeft = nextScrollLeft;
        }
      }

      function scheduleStickyDividerSync() {
        if (stickyDividerFrame) return;
        stickyDividerFrame = window.requestAnimationFrame(() => {
          stickyDividerFrame = 0;
          syncStickyDivider();
        });
      }

      function handleResponsiveResize() {
        document.documentElement.classList.add("is-resizing");
        window.clearTimeout(resizeSettledTimer);
        resizeSettledTimer = window.setTimeout(() => {
          document.documentElement.classList.remove("is-resizing");
        }, 140);
        scheduleStickyDividerSync();
      }

      function scrollContentListToTop() {
        const toolbarHeight = Math.ceil(contentToolbar.getBoundingClientRect().height);
        if (workspace && workspace.scrollHeight > workspace.clientHeight) {
          const targetTop = Math.max(
            0,
            workspace.scrollTop + contentPanel.getBoundingClientRect().top - workspace.getBoundingClientRect().top - toolbarHeight
          );
          workspace.scrollTo({ top: targetTop, left: workspace.scrollLeft });
          return;
        }
        window.scrollTo({
          top: Math.max(0, window.scrollY + contentPanel.getBoundingClientRect().top - toolbarHeight),
          left: window.scrollX
        });
      }

      videoListScroll.addEventListener("scroll", scheduleStickyDividerSync, { passive: true });
      window.addEventListener("resize", handleResponsiveResize);

      pageSizeTrigger.addEventListener("click", (event) => {
        event.stopPropagation();
        const shouldOpen = pageSizeMenu.hidden;
        closeFilterMenus();
        pageSizeSelect.classList.toggle("open", shouldOpen);
        pageSizeTrigger.setAttribute("aria-expanded", String(shouldOpen));
        pageSizeMenu.hidden = !shouldOpen;
      });

      pageSizeOptions.forEach((option) => {
        option.addEventListener("click", (event) => {
          event.stopPropagation();
          pageSize = Number(option.dataset.pageSizeOption);
          pageSizeTrigger.dataset.pageSizeValue = option.dataset.pageSizeOption;
          pageSizeOptions.forEach((item) => item.classList.toggle("selected", item === option));
          syncPageSizeLabels();
          currentPage = 1;
          renderVideoList(currentContentView);
          scrollContentListToTop();
          syncStickyDivider();
          closePageSizeMenu();
        });
      });

      pageNumbers.addEventListener("click", (event) => {
        const pageButton = event.target.closest("[data-page-number]");
        if (!pageButton) return;
        currentPage = Number(pageButton.dataset.pageNumber);
        renderVideoList(currentContentView);
        scrollContentListToTop();
        syncStickyDivider();
      });

      pageSizeSelect.addEventListener("click", (event) => {
        event.stopPropagation();
      });

      document.addEventListener("click", closePageSizeMenu);

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          closePageSizeMenu();
        }
      });

      pageSizeTrigger.addEventListener("keydown", (event) => {
        if (!["Enter", " "].includes(event.key)) return;
        event.preventDefault();
        pageSizeTrigger.click();
      });

      pageSizeOptions.forEach((option) => {
        option.addEventListener("keydown", (event) => {
          if (!["Enter", " "].includes(event.key)) return;
          event.preventDefault();
          option.click();
        });
      });

      prevPageButton.addEventListener("click", () => {
        currentPage = Math.max(1, currentPage - 1);
        renderVideoList(currentContentView);
        scrollContentListToTop();
        syncStickyDivider();
      });

      nextPageButton.addEventListener("click", () => {
        const totalPages = Math.max(1, Math.ceil(getVideoRows(currentContentView).length / pageSize));
        currentPage = Math.min(totalPages, currentPage + 1);
        renderVideoList(currentContentView);
        scrollContentListToTop();
        syncStickyDivider();
      });

      contentTabs.forEach((tab, index) => {
        tab.addEventListener("click", () => {
          setContentView(tab.dataset.contentTab);
        });
        tab.addEventListener("keydown", (event) => {
          if (!["ArrowLeft", "ArrowRight"].includes(event.key)) {
            return;
          }
          event.preventDefault();
          const offset = event.key === "ArrowRight" ? 1 : -1;
          const nextIndex = (index + offset + contentTabs.length) % contentTabs.length;
          contentTabs[nextIndex].focus();
          setContentView(contentTabs[nextIndex].dataset.contentTab);
        });
      });

      syncSearchClear();
      setContentView("all");
      syncThemePreference();
      setLanguage(localStorage.getItem("studio-language") || "en");
    </script>
  </body>
</html>
